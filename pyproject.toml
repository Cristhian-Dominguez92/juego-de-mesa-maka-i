[project]
name = "makai"
version = "0.1.0"
description = "Maka'i — el tradicional juego de cartas paraguayo"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Cristhian Domínguez" }]

# IMPORTANTE: estas dependencias son las que se empaquetan dentro del APK.
# No agregues aquí librerías de escritorio (pygame, etc.): no compilan para
# Android y rompen `flet build apk`. Para eso está requirements-dev.txt.
dependencies = [
    "flet==0.28.3",
]

# --- Configuración de `flet build` -------------------------------------------
# Claves verificadas contra flet-cli 0.28.3.
[tool.flet]
org = "com.cristhiandominguez"
product = "Maka'i"
company = "Cristhian Domínguez"
copyright = "Copyright (c) 2026 Cristhian Domínguez"
build_number = 1

[tool.flet.app]
path = "."
module = "main"

[tool.flet.splash]
color = "#1a4a1a"
dark_color = "#1a4a1a"

[tool.flet.android]
# false = un solo APK universal (más pesado, más simple de distribuir).
# Ponelo en true cuando publiques en Play Store para reducir el tamaño.
split_per_abi = false

# --- Calidad de código ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", ".venv", "_local"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes. I: orden de imports. UP: sintaxis moderna.
# B: bugbear (bugs comunes).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: juega partidas completas contra la UI; usar `-m 'not lento'` para saltarlos",
]
