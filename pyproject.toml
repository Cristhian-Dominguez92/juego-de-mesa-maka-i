[project]
name = "makai"
version = "0.1.0"
description = "Maka'i — el tradicional juego de cartas paraguayo"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Cristhian Domínguez" }]

# IMPORTANTE: estas dependencias son las que se empaquetan dentro del APK.
# No agregues aquí librerías que sean solo de escritorio: no compilan para
# Android y rompen `flet build apk`. Para eso está requirements-dev.txt.
# El audio usa ft.Audio, incluido en flet: no hace falta nada más.
dependencies = [
    "flet==0.28.3",
]

# --- Configuración de `flet build` -------------------------------------------
# Claves verificadas contra flet-cli 0.28.3.
[tool.flet]
org = "com.cristhiandominguez"
product = "Maka'i"
company = "Cristhian Domínguez"
copyright = "Copyright (c) 2026 Cristhian Domínguez"
build_number = 1

[tool.flet.app]
path = "."
module = "main"

# `flet build` empaqueta TODO el directorio de la app salvo lo que se liste
# acá; por defecto solo excluye "build". Sin esta lista el APK se llevaría el
# entorno virtual entero, los tests, y —lo más grave— el contenido de _local/,
# que es justamente el material sin licencia que se retiró del proyecto.
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "_local",
    "docs",
    "tests",
    "tools",
    "venv",
]

[tool.flet.splash]
color = "#1a4a1a"
dark_color = "#1a4a1a"

[tool.flet.android]
# false = un solo APK universal (más pesado, más simple de distribuir).
# Ponelo en true cuando publiques en Play Store para reducir el tamaño.
split_per_abi = false

# --- Firma del APK ------------------------------------------------------------
# Sin firma, el APK sirve para probar pero NO es publicable en Google Play.
#
# El keystore lo tenés que generar vos (contiene tu clave privada; ver README).
# Este archivo solo declara dónde está y con qué alias. Las CONTRASEÑAS nunca
# van acá: `flet build` las lee de las variables de entorno
# FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD y FLET_ANDROID_SIGNING_KEY_PASSWORD.
#
# Descomentá cuando tengas el keystore. Si `key_store` apunta a un archivo que
# no existe, el build falla; mientras esté comentado sale un APK sin firmar.
#
# [tool.flet.android.signing]
# key_store = "upload-keystore.jks"
# key_alias = "upload"

# --- Calidad de código ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", ".venv", "_local"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes. I: orden de imports. UP: sintaxis moderna.
# B: bugbear (bugs comunes).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: juega partidas completas contra la UI; usar `-m 'not lento'` para saltarlos",
]
filterwarnings = [
    # ft.Audio es obsoleto desde flet 0.26, pero en 0.28.3 es la unica opcion:
    # flet-audio no publica versiones 0.28.x. Ver makai/ui/audio.py. Se silencia
    # solo este mensaje para que no tape avisos que si importan.
    "ignore:Audio\\(\\) is deprecated:DeprecationWarning",
]
