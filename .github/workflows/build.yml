name: Build Maka'i APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela builds anteriores del mismo branch cuando llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # flet 0.28.3 no soporta Python 3.14.
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # `flet` a secas alcanza para construir controles y así detectar cambios
      # incompatibles de su API (no hace falta flet-desktop ni flet-web). Sin
      # él, tests/test_ui_flujo.py se saltaría en silencio y el CI daría verde
      # con el juego roto.
      - name: Install test dependencies
        run: pip install pytest==9.1.1 flet==0.28.3

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # flet 0.28.3 no soporta Python 3.14.
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flet build tools
        run: pip install "flet[all]==0.28.3"

      - name: Build APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makai-apk-${{ github.sha }}
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
