name: Build Maka'i APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela builds anteriores del mismo branch cuando llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # flet 0.28.3 no soporta Python 3.14.
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Se instalan las dependencias reales del juego, no una lista aparte.
      # Cuando estaban duplicadas acá, agregar flet-audio al proyecto dejó el CI
      # sin ese paquete y los tests fallaron al importar. Con requirements.txt
      # no puede volver a desincronizarse.
      #
      # No hacen falta flet-desktop ni flet-web: alcanza con poder construir los
      # controles. Pero sí hace falta que estén todos los que el código importa,
      # o tests/test_ui_flujo.py se saltaría en silencio y el CI daría verde con
      # el juego roto.
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # flet 0.28.3 no soporta Python 3.14.
          python-version: '3.12'
          cache: 'pip'

      # El runner ya trae un JDK, pero cuál cambia con la imagen. Fijarlo evita
      # que un cambio de imagen rompa el build de Gradle sin aviso.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # flet-cli 0.28.3 exige Flutter 3.29.x exactamente: compara major y
          # minor contra su MINIMAL_FLUTTER_VERSION. Con cualquier otra versión
          # se descarga 3.29.2 por su cuenta, desperdiciando el cache y varios
          # minutos de build.
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install Flet build tools
        run: pip install "flet[all]==0.28.3"

      # El keystore se guarda como secreto en base64, porque los secretos de
      # GitHub solo aceptan texto. Se mapea a una variable de entorno porque el
      # contexto `secrets` no es utilizable dentro de un `if`.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            echo "Keystore restaurado."
          else
            echo "Sin keystore configurado."
          fi

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # --no-rich-output es imprescindible en CI: sin él, flet imprime cada
          # cuadro del spinner como una línea nueva y el error real queda
          # sepultado bajo cientos de repeticiones.
          COMUNES="--verbose --no-rich-output"

          if [ -f upload-keystore.jks ]; then
            # Ruta ABSOLUTA: Gradle corre desde un subdirectorio del build, así
            # que una ruta relativa no resuelve al mismo archivo.
            flet build apk $COMUNES \
              --android-signing-key-store "$GITHUB_WORKSPACE/upload-keystore.jks" \
              --android-signing-key-alias upload
          else
            echo "::warning::Sin keystore: el APK sale SIN FIRMAR y no es publicable."
            flet build apk $COMUNES
          fi

      # El keystore es una clave privada: no debe sobrevivir al job ni terminar
      # dentro de un artefacto.
      - name: Remove keystore
        if: always()
        run: rm -f upload-keystore.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makai-apk-${{ github.sha }}
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
